<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div>
            <form id="color-picker">
                <input id="color-hex" type="color" name="color-hex" value="#F55A5A">
                <select id="mode" class="custom-select-arrow" name="mode">
                    <button>
                        <selectedcontent></selectedcontent>
                    </button>
                    <option value="monochrome"><span>Monochrome</span></option>
                    <option value="monochrome-dark"><span>Monochrome-dark</span></option>
                    <option value="monochrome-light"><span>Monochrome-light</span></option>
                    <option value="analogic"><span>Analogic</span></option>
                    <option value="complement"><span>Complement</span></option>
                    <option value="analogic-complement"><span>Analogic-complement</span></option>
                    <option value="triad"><span>Triad</span></option>
                </select>
                <button type="submit">Get color scheme</button>
            </form>
        </div>
        <div class="colors">
            
        </div>
        <p class="notify">Copied!</p>
        <script src="index.js"></script>
    </body>
</html>
