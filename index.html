<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
    <body>
        <div>
            <form id="color-picker">
                <input type="color">
                <select id="mode-selector" class="custom-select-arrow">
                    <button>
                        <selectedcontent><i class="fa-solid fa-check"></i></selectedcontent>
                    </button>
                    <option value="monochrome"><span>Monochrome</span></option>
                    <option value="monochrome-dark"><span>Monochrome-dark</span></option>
                    <option value="monochrome-light"><span>Monochrome-light</span></option>
                    <option value="analogic"><span>Analogic</span></option>
                    <option value="complement"><span>Complement</span></option>
                    <option value="analogic-complement"><span>Analogic-complement</span></option>
                    <option value="triad"><span>Triad</span></option>
                </select>
                <button type="submit">Get color scheme</button>
            </form>
        </div>
        <div class="colors">
            
        </div>
        <script src="index.js"></script>
    </body>
</html>
